    <section class="section" id="lead">
      <div class="container lead-box">
        <div class="lead-box__text">
          <p class="eyebrow">Заявка</p>
          <h2>Расскажите о задаче</h2>
          <p>Ответим в течение рабочего дня, зададим пару уточняющих вопросов и предложим решение и тариф. Это бесплатно и ни к чему не обязывает.</p>
          <ul class="ticks"><li>Бесплатная консультация</li><li>Оценка сроков и стоимости</li><li>Прототип до подписания договора</li></ul>
        </div>
        <form class="card form" id="lead-form" action="/api/lead" method="post" novalidate>
          <div class="field">
            <label for="f-name">Имя</label>
            <input id="f-name" name="name" type="text" autocomplete="name" required minlength="2" maxlength="100" placeholder="Как к вам обращаться">
          </div>
          <div class="field">
            <label for="f-contact">Телефон или Telegram</label>
            <input id="f-contact" name="contact" type="text" autocomplete="tel" required minlength="3" maxlength="100" placeholder="+7 900 000-00-00 или @username">
          </div>
          <div class="field">
            <label for="f-product">Что нужно</label>
            <select id="f-product" name="product">
              <option value="Лендинг">Лендинг / сайт-визитка</option>
              <option value="Многостраничный сайт">Многостраничный сайт</option>
              <option value="Интернет-магазин">Интернет-магазин</option>
              <option value="Веб-приложение">Веб-приложение (CRM, кабинет, запись)</option>
              <option value="Мобильное приложение Android">Мобильное приложение Android</option>
              <option value="Десктоп-приложение">Десктоп-приложение</option>
              <option value="Готовое решение">Готовое решение из каталога</option>
              <option value="Пока не знаю">Пока не знаю, нужна консультация</option>
            </select>
          </div>
          <div class="field">
            <label for="f-message">Кратко о задаче</label>
            <textarea id="f-message" name="message" rows="5" maxlength="2000" placeholder="Например: салон красоты, нужна онлайн-запись и напоминания клиентам"></textarea>
          </div>
          <input type="hidden" name="calc" id="f-calc">
          <div class="hp" aria-hidden="true"><label for="f-website">Сайт</label><input id="f-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
          <label class="check check--nda">
            <input type="checkbox" name="nda" id="f-nda" value="1">
            <span>Подписать соглашение о неконкуренции и неразглашении (+9&nbsp;900&nbsp;₽) — <a href="/faq#nda" target="_blank" rel="noopener">что это</a></span>
          </label>
          <label class="check">
            <input type="checkbox" name="consent" value="1" required>
            <span>Согласен на обработку персональных данных в соответствии с <a href="/privacy" target="_blank" rel="noopener">политикой конфиденциальности</a></span>
          </label>
          <button class="btn btn--lg btn--block" type="submit">Отправить заявку</button>
          <p class="form__status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
